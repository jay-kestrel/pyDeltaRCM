# 02_muddy_sheet — mud-dominated sediment supply.
# Same grid/seed as 01_classic_birdsfoot; f_bedload 0.05 and C0_percent 0.3 (3x mud).
# Derived (not configurable): Qw0 = 1250 m^3/s, Qs0 = Qw0*C0 = 3.75 m^3/s,
#   dVs = 31250 m^3, dt = dVs/Qs0 = 8333.33 s.
# gamma = g*S0*dx/u0^2 = 0.0736 <= 0.1 (no warning).
# Expected morphology: thin distal sheets, wide plume.
Length: 4000.0
Width: 4000.0
dx: 50.0
N0_meters: 250.0      # exactly 5 cells
L0_meters: 150.0      # exactly 3 cells
u0: 1.0
h0: 5.0
S0: 0.00015
C0_percent: 0.3
f_bedload: 0.05
Np_water: 500
Np_sed: 500
seed: 14
save_eta_figs: true
save_figs_sequential: true
save_dt: 300000       # a figure every 36 steps; the final save lands on the last step
out_dir: runs/muddy_sheet         # replaced by the harness with a per-run temp dir
timesteps: 720        # 720 * 8333.33 s = 6.0e6 s ~ 0.19 model yr; calibrated to budget
