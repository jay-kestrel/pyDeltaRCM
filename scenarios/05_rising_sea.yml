# 05_rising_sea — transgression under sea-level rise.
# Same grid/seed as 01_classic_birdsfoot, plus SLR.
# The model applies SLR in m/s of model time and applies no scaling itself, so the
# mm/yr rate is pre-scaled here with the shipped helper:
#   SLR = preprocessor.scale_relative_sea_level_rise_rate(5.0, If=1)
#       = (5.0 mm/yr / 1000) / (365.25 * 86400 s/yr) = 1.5844043907014473e-10 m/s
# Derived (not configurable): Qw0 = 1250 m^3/s, Qs0 = 1.25 m^3/s, dt = 25000 s.
# gamma = g*S0*dx/u0^2 = 0.0736 <= 0.1 (no warning).
# Expected morphology: shoreline retreat, drowned lobes (forcing is mm-scale at this
# timescale; the run is 1.2x the anchor's so the final bed is distinct -- see README).
Length: 4000.0
Width: 4000.0
dx: 50.0
N0_meters: 250.0      # exactly 5 cells
L0_meters: 150.0      # exactly 3 cells
u0: 1.0
h0: 5.0
S0: 0.00015
C0_percent: 0.1
f_bedload: 0.5
Np_water: 500
Np_sed: 500
SLR: 1.5844043907014473e-10   # 5 mm/yr pre-scaled, see comment above
seed: 14
save_eta_figs: true
save_figs_sequential: true
save_dt: 1200000      # a figure every 48 steps; the final save lands on the last step
out_dir: runs/rising_sea          # replaced by the harness with a per-run temp dir
timesteps: 864        # 864 * 25000 s = 2.16e7 s ~ 0.69 model yr; calibrated to budget
