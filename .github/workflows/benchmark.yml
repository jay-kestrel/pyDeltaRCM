name: benchmark

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install -r requirements.txt
    - name: Install pyDeltaRCM
      run: |
        pip install .
    - name: Run benchmark smoke
      run: |
        python benchmarks/benchmark_timestep.py --smoke --output-dir benchmarks/results
    - name: Upload benchmark smoke results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-smoke-results
        path: benchmarks/results/

  fixture-parity:
    # Gate the normalized fixtures and the Python reference runner:
    # fixture byte-stability, manifest completeness, and the golden eta
    # reproduction that the C/Rust ports will be held to.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install -r requirements.txt
    - name: Install pyDeltaRCM
      run: |
        pip install .
    - name: Run fixture and reference parity tests
      run: |
        python -m pytest tests/test_benchmark_fixtures.py tests/test_benchmark_reference.py -v
    - name: Upload parity results
      uses: actions/upload-artifact@v7
      with:
        name: fixture-parity-results
        path: benchmarks/results/
      if: always()
