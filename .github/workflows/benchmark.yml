name: benchmark

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install Rust toolchain
      run: rustup default stable
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install -r requirements.txt
    - name: Install pyDeltaRCM
      run: |
        pip install -e .
    - name: Run benchmark smoke
      run: |
        python benchmarks/benchmark_timestep.py --smoke --output-dir benchmarks/results
    - name: Upload benchmark smoke results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-smoke-results
        path: benchmarks/results/
