# This workflow installs and tests pyDeltaRCM on multiple python versions and operating systems.
#
# Org policy: no external GitHub Actions (no `uses:` steps). Checkout, the Rust
# toolchain, and Python (via uv) are provisioned inline, following the same
# pattern as julia.yml.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # run workflow at 12AM on first day of every month

permissions:
  contents: read

jobs:

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # pin the non-interactive backend: runner toolcache updates can leave
      # tkinter broken (TclError: Can't find a usable init.tcl) and make
      # backend selection nondeterministic on windows
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
    - name: Checkout code
      shell: bash
      run: |
        REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        SHA="${{ github.event.pull_request.head.sha || github.sha }}"
        git clone --quiet "$REPO_URL" .
        git fetch --quiet --depth 1 origin "$SHA"
        git checkout --quiet --detach "$SHA"

    - name: Ensure Rust toolchain
      shell: bash
      run: |
        if ! command -v cargo > /dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        cargo --version

    - name: Set up Python ${{ matrix.python-version }} via uv
      shell: bash
      run: |
        HOST_PY=python3
        command -v python3 > /dev/null 2>&1 || HOST_PY=python
        "$HOST_PY" -m pip install --quiet uv
        "$HOST_PY" -m uv python install ${{ matrix.python-version }}
        "$HOST_PY" -m uv venv --python ${{ matrix.python-version }} .venv
        if [ -x .venv/bin/python ]; then VIRTUAL_PY="$(pwd)/.venv/bin/python"; else VIRTUAL_PY="$(pwd)/.venv/Scripts/python.exe"; fi
        echo "VIRTUAL_PY=$VIRTUAL_PY" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pip install --upgrade pip setuptools
        "$VIRTUAL_PY" -m pip install -r requirements-test.txt -r requirements.txt

    - name: Install pyDeltaRCM
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pip install -e .

    - name: Test with pytest
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pytest --mpl --mpl-baseline-path=tests/imgs_baseline


  coverage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      OS: ${{ matrix.os }}
      PYTHON: '3.13'
      MPLBACKEND: Agg
      PYDELTARCM_NATIVE: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      shell: bash
      run: |
        REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        SHA="${{ github.event.pull_request.head.sha || github.sha }}"
        git clone --quiet "$REPO_URL" .
        git fetch --quiet --depth 1 origin "$SHA"
        git checkout --quiet --detach "$SHA"

    - name: Ensure Rust toolchain
      shell: bash
      run: |
        if ! command -v cargo > /dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        cargo --version

    - name: Set up Python via uv
      shell: bash
      run: |
        HOST_PY=python3
        command -v python3 > /dev/null 2>&1 || HOST_PY=python
        "$HOST_PY" -m pip install --quiet uv
        "$HOST_PY" -m uv python install "$PYTHON"
        "$HOST_PY" -m uv venv --python "$PYTHON" .venv
        if [ -x .venv/bin/python ]; then VIRTUAL_PY="$(pwd)/.venv/bin/python"; else VIRTUAL_PY="$(pwd)/.venv/Scripts/python.exe"; fi
        echo "VIRTUAL_PY=$VIRTUAL_PY" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pip install --upgrade pip setuptools
        "$VIRTUAL_PY" -m pip install pytest pytest-cov pytest-mpl coveralls
        "$VIRTUAL_PY" -m pip install -r requirements.txt

    - name: Install pyDeltaRCM
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pip install -e .

    - name: Disable jitted for coverage
      shell: bash
      run: |
        echo "DISABLE_JIT: 1" > .numba_config.yaml

    - name: Test with pytest
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pytest --ignore=tests/integration/ --cov=pyDeltaRCM/ --cov-report=xml --mpl --mpl-baseline-path=tests/imgs_baseline

    - name: Upload coverage to Codecov (best-effort)
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pip install --quiet codecov-cli
        if [ -n "${{ secrets.CODECOV_TOKEN }}" ]; then
          "$VIRTUAL_PY" -m codecovcli upload-process -t "${{ secrets.CODECOV_TOKEN }}" -f coverage.xml \
            || echo "::warning::codecov upload failed (non-blocking; matches prior fail_ci_if_error: false)"
        else
          echo "::warning::CODECOV_TOKEN not set; coverage.xml produced, upload skipped"
        fi


  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      shell: bash
      run: |
        REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        SHA="${{ github.event.pull_request.head.sha || github.sha }}"
        git clone --quiet "$REPO_URL" .
        git fetch --quiet --depth 1 origin "$SHA"
        git checkout --quiet --detach "$SHA"

    - name: Ensure Rust toolchain
      shell: bash
      run: |
        if ! command -v cargo > /dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        cargo --version

    - name: Set up Python via uv
      shell: bash
      run: |
        HOST_PY=python3
        command -v python3 > /dev/null 2>&1 || HOST_PY=python
        "$HOST_PY" -m pip install --quiet uv
        "$HOST_PY" -m uv python install 3.13
        "$HOST_PY" -m uv venv --python 3.13 .venv
        if [ -x .venv/bin/python ]; then VIRTUAL_PY="$(pwd)/.venv/bin/python"; else VIRTUAL_PY="$(pwd)/.venv/Scripts/python.exe"; fi
        echo "VIRTUAL_PY=$VIRTUAL_PY" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pip install --upgrade pip setuptools
        "$VIRTUAL_PY" -m pip install -r requirements.txt
        "$VIRTUAL_PY" -m pip install -r requirements-docs.txt
        sudo apt-get update -y && sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended dvipng

    - name: Install pyDeltaRCM
      shell: bash
      run: |
        "$VIRTUAL_PY" -m pip install -e .

    - name: Build and test documentation
      shell: bash
      run: |
        (cd docs && make docs)
