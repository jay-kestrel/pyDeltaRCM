[project]
name = "pyDeltaRCM"
requires-python = ">=3.11"
description = "Python version of original Matlab DeltaRCM."
keywords = []
authors = [
    { name = "Andrew Moodie", email = "amoodie@tamu.edu" },
]
maintainers = [
    { name = "Andrew Moodie", email = "amoodie@tamu.edu" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "importlib-resources; python_version < '3.12'",
    "matplotlib>=3.6.1",
    "scipy",
    "netCDF4",
    "pyyaml",
    "numpy>=1.22"
]
readme = { file = "README.rst", content-type = "text/x-rst" }
dynamic = ["version"]

[project.license]
text = "MIT"

[project.urls]
documentation = "https://deltarcm.org/pyDeltaRCM"
homepage = "https://deltarcm.org/pyDeltaRCM"
repository = "https://github.com/DeltaRCM/pyDeltaRCM"

[project.optional-dependencies]
docs = [
    "sphinx",
]
testing = [
    "coveralls",
    "pytest",
    "pytest-cov",
    "pytest-mpl"
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "pyDeltaRCM._native"
features = ["extension-module"]
include = ["pyDeltaRCM/default.yml", "LICENSE"]

[project.scripts]
pyDeltaRCM = "pyDeltaRCM.preprocessor:preprocessor_wrapper"

[tool.coverage.run]
relative_files = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
norecursedirs = [
    ".*",
    "*.egg*",
    "build",
    "dist",
]
addopts = [
    "--ignore=setup.py",
    "--tb=native",
    "--durations=16",
    "--strict-markers",
    "--doctest-modules",
    "-vvv",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ELLIPSIS",
]